id: cors-permissive-credentials
info:
  name: Permissive CORS with Credentials Misconfiguration
  author: bountybot
  severity: medium
  description: The application reflects arbitrary Origin header values along with Access-Control-Allow-Credentials set to true, allowing cross-origin credentialed data theft.
  tags: cors,misconfig,generic
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/vulnerable/cors/user-info"
    headers:
      Origin: "https://evil-attacker.internal"
      Cookie: "session_token=session_bob_456"
      Authorization: "Bearer session_bob_456"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "access-control-allow-credentials: true"
        part: header
        case-insensitive: true
      - type: word
        words:
          - "access-control-allow-origin: https://evil-attacker.internal"
        part: header
        case-insensitive: true
