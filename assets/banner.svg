<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="bountybot — scope-gated bug-bounty pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="0.55" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#0a2424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399" fill-opacity="0.7"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="19" fill="none" stroke="#34d399" stroke-opacity="0.28"/>

  <!-- logo mark: a gate with a check -->
  <g transform="translate(64 58)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#mark)" opacity="0.16"/>
    <rect x="0.75" y="0.75" width="44.5" height="44.5" rx="11.25" fill="none" stroke="url(#mark)" stroke-opacity="0.75"/>
    <path d="M13 24.5l6.5 6.5L33 18.5" fill="none" stroke="#34d399" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="126" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="3.4" fill="#34d399">BUG-BOUNTY PIPELINE</text>
  <text x="124" y="146" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.6" fill="#f8fafc">bountybot</text>
  <text x="126" y="184" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20.5" fill="#94a3b8">scope-gated recon, evidence, and reports for HackerOne</text>
  <text x="126" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5b7186">&#8704; request &#183; scope.check(url) &#183; human approves &#183; nothing auto-submits</text>

  <!-- pipeline nodes -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="690" y="96" font-size="11" letter-spacing="2.6" fill="#5b7186">PIPELINE</text>

    <rect x="690" y="112" width="104" height="52" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="742" y="143" text-anchor="middle" font-size="12" letter-spacing="1.6" fill="#d1fae5">SCOPE</text>

    <rect x="818" y="112" width="104" height="52" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="870" y="143" text-anchor="middle" font-size="12" letter-spacing="1.6" fill="#e2e8f0">RECON</text>

    <rect x="946" y="112" width="104" height="52" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="998" y="143" text-anchor="middle" font-size="12" letter-spacing="1.6" fill="#e2e8f0">CHECKS</text>

    <rect x="1074" y="112" width="104" height="52" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1126" y="143" text-anchor="middle" font-size="12" letter-spacing="1.6" fill="#e2e8f0">REPORT</text>

    <line x1="796" y1="138" x2="812" y2="138" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="924" y1="138" x2="940" y2="138" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="1052" y1="138" x2="1068" y2="138" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#arrow)"/>

    <text x="742" y="188" text-anchor="middle" font-size="10.5" fill="#5b7186">deny</text>
    <text x="870" y="188" text-anchor="middle" font-size="10.5" fill="#5b7186">passive</text>
    <text x="998" y="188" text-anchor="middle" font-size="10.5" fill="#5b7186">deterministic</text>
    <text x="1126" y="188" text-anchor="middle" font-size="10.5" fill="#5b7186">H1 markdown</text>
  </g>

  <rect x="64" y="252" width="1072" height="1.5" fill="url(#accent)" opacity="0.45"/>
</svg>
