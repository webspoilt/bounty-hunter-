[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bountybot"
version = "2.6.0"
description = "Scope-gated bug-bounty pipeline: recon, two-role authz testing, evidence, H1 reports"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "packaging>=24.0",
    "esprima>=4.0.1",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]
h1 = ["pyarrow>=15.0.0", "huggingface-hub>=0.23.0"]
engines = ["sqlmap>=1.8.0", "semgrep>=1.60.0"]

[project.scripts]
bb = "bb.cli:main"

[tool.setuptools]
packages = ["bb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
